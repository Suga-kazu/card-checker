<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カード配列検索・管理ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

  <!-- ヘッダー -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold text-indigo-400">🃏 カード配列チェッカー</h1>
      <div class="flex gap-2">
        <button onclick="switchTab('search')" id="tabSearch" class="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-semibold transition">🔍 検索</button>
        <button onclick="switchTab('manage')" id="tabManage" class="text-xs bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg font-semibold transition">⚙️ 管理・辞書</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- 1. 検索モード画面 -->
    <section id="searchSection" class="space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
        <h2 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">
          🔍 番号の出目を入力
        </h2>
        
        <div class="grid grid-cols-3 gap-2 mb-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">1枚目(古い)</label>
            <input type="text" id="slot1" placeholder="例: 1" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-center text-sm font-bold focus:border-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">2枚目</label>
            <input type="text" id="slot2" placeholder="例: 2" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-center text-sm font-bold focus:border-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">3枚目(直近)</label>
            <input type="text" id="slot3" placeholder="例: 3" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-center text-sm font-bold focus:border-indigo-500 focus:outline-none">
          </div>
        </div>

        <div class="flex gap-2">
          <button onclick="searchSequence()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg shadow transition text-sm">
            検索実行
          </button>
          <button onclick="clearSearch()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 rounded-lg text-sm transition">
            クリア
          </button>
        </div>
      </div>

      <!-- 検索結果表示エリア -->
      <div id="resultsArea" class="space-y-3"></div>
    </section>

    <!-- 2. データ管理モード画面 (初期状態は非表示) -->
    <section id="manageSection" class="hidden space-y-6">
      
      <!-- シリンダー配列の登録 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow space-y-3">
        <h2 class="text-sm font-bold text-indigo-400">➕ シリンダー配列（番号）の追加</h2>
        <div>
          <label class="block text-xs text-slate-400 mb-1">シリンダー名</label>
          <input type="text" id="newGroupTitle" placeholder="例: Aシリンダー" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm focus:outline-none">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">カード番号の配列 (カンマ区切り)</label>
          <textarea id="newGroupCards" rows="3" placeholder="例: 1, 2, 3, 4, 5, 6, 7" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm font-mono focus:outline-none"></textarea>
        </div>
        <button onclick="addPattern()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-sm transition">
          配列を追加保存
        </button>
      </div>

      <!-- カード名辞書の編集 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow space-y-3">
        <h2 class="text-sm font-bold text-amber-400">📖 カード名・レアリティ辞書</h2>
        <p class="text-[11px] text-slate-400">番号に対する名前を後からいつでも紐づけられます。</p>
        <div class="flex gap-2">
          <input type="text" id="dictNo" placeholder="番号(例: 1)" class="w-1/3 bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-center focus:outline-none">
          <input type="text" id="dictName" placeholder="名前(例: SR悟空)" class="w-2/3 bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm focus:outline-none">
        </div>
        <button onclick="saveDictionaryItem()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded-lg text-sm transition">
          辞書に登録・更新
        </button>
        <div id="dictList" class="space-y-1 max-h-40 overflow-y-auto text-xs pt-2"></div>
      </div>

      <!-- 登録済みシリンダー一覧 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-300">📚 登録済みシリンダー一覧</h2>
          <button onclick="resetToDefault()" class="text-xs text-rose-400 hover:underline">初期データに戻す</button>
        </div>
        <div id="patternsList" class="space-y-2 text-xs"></div>
      </div>

    </section>

  </main>

  <script>
    const DEFAULT_PATTERNS = [
      { id: "1", title: "シリンダーA", numbers: ["1", "2", "3", "4", "5", "6", "7", "8"] },
      { id: "2", title: "シリンダーB", numbers: ["2", "4", "1", "5", "3", "8", "7", "6"] }
    ];
    const DEFAULT_DICT = {
      "1": "N", "2": "N", "3": "R", "4": "N", 
      "5": "SR", "6": "N", "7": "R", "8": "UR"
    };

    function getStoredPatterns() {
      const data = localStorage.getItem('card_patterns_v2');
      return data ? JSON.parse(data) : DEFAULT_PATTERNS;
    }
    function savePatterns(data) {
      localStorage.setItem('card_patterns_v2', JSON.stringify(data));
    }
    function getStoredDict() {
      const data = localStorage.getItem('card_dict_v2');
      return data ? JSON.parse(data) : DEFAULT_DICT;
    }
    function saveDict(data) {
      localStorage.setItem('card_dict_v2', JSON.stringify(data));
    }

    function switchTab(tab) {
      const searchSec = document.getElementById('searchSection');
      const manageSec = document.getElementById('manageSection');
      const tabSearch = document.getElementById('tabSearch');
      const tabManage = document.getElementById('tabManage');

      if (tab === 'search') {
        searchSec.classList.remove('hidden');
        manageSec.classList.add('hidden');
        tabSearch.className = "text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-semibold transition";
        tabManage.className = "text-xs bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg font-semibold transition";
      } else {
        searchSec.classList.add('hidden');
        manageSec.classList.remove('hidden');
        tabSearch.className = "text-xs bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg font-semibold transition";
        tabManage.className = "text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-semibold transition";
        renderManageScreen();
      }
    }

    function getCardDisplay(no) {
      const dict = getStoredDict();
      const name = dict[no];
      return name ? `<span class="font-bold">${no}</span><span class="text-[10px] opacity-75 block">${name}</span>` : `<span class="font-bold">${no}</span>`;
    }

    function searchSequence() {
      const s1 = document.getElementById('slot1').value.trim();
      const s2 = document.getElementById('slot2').value.trim();
      const s3 = document.getElementById('slot3').value.trim();

      const query = [s1, s2, s3].filter(x => x !== "");
      const resultsArea = document.getElementById('resultsArea');
      resultsArea.innerHTML = "";

      if (query.length === 0) {
        resultsArea.innerHTML = `<div class="p-3 bg-slate-800 rounded-lg text-slate-400 text-xs text-center">出目を少なくとも1つ入力してください</div>`;
        return;
      }

      const patterns = getStoredPatterns();
      let matches = [];

      patterns.forEach(p => {
        const nums = p.numbers.map(n => n.trim());
        for (let i = 0; i <= nums.length - query.length; i++) {
          let isMatch = true;
          for (let j = 0; j < query.length; j++) {
            if (nums[i + j] !== query[j]) {
              isMatch = false;
              break;
            }
          }
          if (isMatch) {
            // 一致した位置の次から最後まで全部取得
            const nextNums = nums.slice(i + query.length);
            matches.push({
              title: p.title,
              index: i + 1,
              matchedSeq: nums.slice(i, i + query.length),
              nextNums: nextNums
            });
          }
        }
      });

      if (matches.length === 0) {
        resultsArea.innerHTML = `<div class="p-4 bg-slate-800 border border-slate-700 rounded-xl text-center text-xs text-slate-400">一致する配列パターンが見つかりませんでした。</div>`;
        return;
      }

      matches.forEach(m => {
        const matchedNames = m.matchedSeq.map(n => getCardDisplay(n)).join(' <span class="text-slate-500">→</span> ');
        
        // 残りのカードを横スクロールで並べるHTML
        let nextHtml = '<span class="text-slate-500 text-xs">（これ以降のデータなし）</span>';
        if (m.nextNums.length > 0) {
          nextHtml = `
            <div class="flex gap-1.5 overflow-x-auto pb-2 pt-1 scrollbar-thin">
              ${m.nextNums.map((n, idx) => `
                <div class="flex-shrink-0 bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-center min-w-[50px]">
                  <span class="text-[10px] text-slate-400 block">+#${idx + 1}</span>
                  <div class="text-xs text-emerald-300 font-mono">${getCardDisplay(n)}</div>
                </div>
              `).join('')}
            </div>
          `;
        }

        const html = `
          <div class="bg-slate-800 p-4 rounded-xl border border-indigo-500/30 shadow space-y-3">
            <div class="flex justify-between items-start">
              <span class="text-xs font-bold text-indigo-300 bg-indigo-950 px-2 py-0.5 rounded border border-indigo-800">${m.title}</span>
              <span class="text-xs text-slate-400">位置: ${m.index}枚目付近</span>
            </div>
            <div class="text-xs text-slate-300 bg-slate-900/50 p-2 rounded border border-slate-700/50">
              <span class="text-[10px] text-slate-400 block mb-1">一致した出目:</span>
              <div class="flex flex-wrap gap-2 items-center font-mono text-amber-300">${matchedNames}</div>
            </div>
            <div>
              <span class="text-xs font-semibold text-emerald-400 block mb-1">🔮 以降の排出予測（横スクロール）:</span>
              ${nextHtml}
            </div>
          </div>
        `;
        resultsArea.insertAdjacentHTML('beforeend', html);
      });
    }

    function clearSearch() {
      document.getElementById('slot1').value = "";
      document.getElementById('slot2').value = "";
      document.getElementById('slot3').value = "";
      document.getElementById('resultsArea').innerHTML = "";
    }

    function addPattern() {
      const title = document.getElementById('newGroupTitle').value.trim();
      const cardsStr = document.getElementById('newGroupCards').value.trim();

      if (!title || !cardsStr) {
        alert("タイトルと番号の配列を入力してください");
        return;
      }

      const numbers = cardsStr.split(/[,,\s]+/).map(c => c.trim()).filter(c => c !== "");
      const patterns = getStoredPatterns();
      
      patterns.push({ id: Date.now().toString(), title, numbers });
      savePatterns(patterns);
      
      document.getElementById('newGroupTitle').value = "";
      document.getElementById('newGroupCards').value = "";
      renderManageScreen();
      alert("シリンダー配列を追加しました！");
    }

    function deletePattern(id) {
      if (!confirm("このシリンダーを削除しますか？")) return;
      let patterns = getStoredPatterns();
      patterns = patterns.filter(p => p.id !== id);
      savePatterns(patterns);
      renderManageScreen();
    }

    function saveDictionaryItem() {
      const no = document.getElementById('dictNo').value.trim();
      const name = document.getElementById('dictName').value.trim();

      if (!no || !name) {
        alert("番号と名前の両方を入力してください");
        return;
      }

      const dict = getStoredDict();
      dict[no] = name;
      saveDict(dict);

      document.getElementById('dictNo').value = "";
      document.getElementById('dictName').value = "";
      renderManageScreen();
    }

    function deleteDictItem(no) {
      let dict = getStoredDict();
      delete dict[no];
      saveDict(dict);
      renderManageScreen();
    }

    function renderManageScreen() {
      const listEl = document.getElementById('patternsList');
      const patterns = getStoredPatterns();
      listEl.innerHTML = "";
      patterns.forEach(p => {
        listEl.insertAdjacentHTML('beforeend', `
          <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center">
            <div>
              <div class="font-bold text-slate-200 text-xs">${p.title} (${p.numbers.length}枚)</div>
              <div class="text-[10px] text-slate-400 font-mono truncate max-w-[200px]">${p.numbers.join(", ")}</div>
            </div>
            <button onclick="deletePattern('${p.id}')" class="text-xs bg-rose-950 text-rose-300 border border-rose-800 px-2 py-1 rounded">削除</button>
          </div>
        `);
      });

      const dictEl = document.getElementById('dictList');
      const dict = getStoredDict();
      dictEl.innerHTML = "";
      const keys = Object.keys(dict).sort((a, b) => Number(a) - Number(b));
      
      if (keys.length === 0) {
        dictEl.innerHTML = `<div class="text-slate-500 text-center">辞書データはまだありません</div>`;
      } else {
        keys.forEach(k => {
          dictEl.insertAdjacentHTML('beforeend', `
            <div class="bg-slate-900 px-2 py-1.5 rounded border border-slate-700 flex justify-between items-center">
              <div><span class="font-mono text-amber-300 font-bold">No.${k}</span> : ${dict[k]}</div>
              <button onclick="deleteDictItem('${k}')" class="text-[10px] text-rose-400 hover:underline">削除</button>
            </div>
          `);
        });
      }
    }

    function resetToDefault() {
      if (confirm("初期データに戻しますか？")) {
        savePatterns(DEFAULT_PATTERNS);
        saveDict(DEFAULT_DICT);
        renderManageScreen();
      }
    }
  </script>
</body>
</html>
